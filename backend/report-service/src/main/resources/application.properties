spring.application.name=report-service
server.port=${PORT:8082}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/report}
spring.sql.init.mode=always
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
identity.url=${IDENTITY_URL:http://127.0.0.1:8081}
weather.url=${WEATHER_URL:https://api.open-meteo.com}
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=3s
